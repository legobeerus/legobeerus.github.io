<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgentOS - Exam History</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">
          <img src="media/logo.png" alt="AgentOS logo" class="logo" />
          <span>AgentOS</span>
        </a>
        <nav class="nav-links">
          <a href="features.html">Features</a>
          <a href="exams.html">Dashboard</a>
          <a href="history.html">History</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </nav>
        <div class="nav-cta"></div>
      </div>
    </header>

    <main class="container">
      <div class="dashboard-header">
        <h1>Graded Exam History</h1>
        <a class="btn btn-ghost" href="exams.html">Back to Dashboard</a>
      </div>
      <p id="statusMsg">Loading...</p>

      <div class="history-controls">
        <label for="historySearch">Search exams</label>
        <input
          id="historySearch"
          class="history-search"
          type="search"
          placeholder="Search by candidate, exam, session ID, or date..."
          autocomplete="off"
        />
      </div>

      <p id="historySummary" class="history-summary"></p>
      <div id="historyList">Loading...</div>
    </main>

    <script src="scripts/server-config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/history.js"></script>
  </body>
</html>
