<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="media/osi_icon.ico" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgentOS - Exam History</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">
          <img src="media/logo.png" alt="AgentOS logo" class="logo" />
          <span>AgentOS</span>
        </a>
        <nav class="nav-links">
          <a href="features.html">Features</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </nav>
        <div class="nav-cta"></div>
      </div>
    </header>

    <main class="container content history-page">
      <div class="dashboard-header">
        <h1>Graded Exam History</h1>
        <a class="btn btn-ghost" href="exams.html">Back to Dashboard</a>
      </div>
      <p id="statusMsg">Loading...</p>

      <div class="history-controls">
        <label for="historySearch">Search exams</label>
        <input
          id="historySearch"
          class="history-search"
          type="search"
          placeholder="Search by candidate, exam, session ID, or date..."
          autocomplete="off"
        />
      </div>

      <p id="historySummary" class="history-summary"></p>
      <div id="historyList">Loading...</div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="brand-sm">
          <img src="media/logo.png" alt="AgentOS" />
          <span>AgentOS</span>
        </div>
        <nav class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Service</a>
        </nav>
        <p class="copyright">© <span id="year-history"></span> AgentOS</p>
      </div>
    </footer>
    <script>document.getElementById('year-history').textContent = new Date().getFullYear();</script>

    <script src="scripts/mobile-nav.js"></script>
    <script src="scripts/server-config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/history.js"></script>
  </body>
</html>
