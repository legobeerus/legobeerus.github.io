<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="media/osi_icon.ico" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AOS Profile — AgentOS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="media/logo.png" alt="AgentOS logo" class="logo" />
        <span>AgentOS</span>
      </a>
      <nav class="nav-links">
        <a href="features.html">Features</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
      <div class="nav-cta"></div>
    </div>
  </header>

  <main class="container content aos-page">
    <section class="profile-shell">
      <p id="statusMsg">Loading...</p>
      <div class="profile-card">
        <div class="profile-card__banner"></div>
        <div class="profile-card__body">
          <img id="aosProfileAvatar" class="profile-card__avatar" alt="AOS profile avatar" src="media/logo.png" />
          <div class="profile-card__identity">
            <h1 id="aosProfileName">Loading profile...</h1>
            <p id="aosProfileHandle">Fetching AOS database details...</p>
            <p id="aosProfileBio" class="profile-card__bio"></p>
          </div>
        </div>
        <div id="aosProfileFacts" class="profile-roles"></div>
      </div>

      <div class="profile-grid">
        <section class="profile-panel">
          <h2>Profile stats</h2>
          <div class="profile-stats" id="aosProfileStats"></div>
          <div class="aos-charge-summary" id="aosChargeSummary"></div>
        </section>

        <section class="profile-panel">
          <h2>Warrants</h2>
          <div id="aosWarrantsList"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="brand-sm">
        <img src="media/logo.png" alt="AgentOS" />
        <span>AgentOS</span>
      </div>
      <nav class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
      </nav>
      <p class="copyright">© <span id="year-aos-profile"></span> AgentOS</p>
    </div>
  </footer>
  <script>document.getElementById('year-aos-profile').textContent=new Date().getFullYear();</script>
  <script src="scripts/mobile-nav.js"></script>
  <script src="scripts/server-config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/aos-utils.js"></script>
  <script src="scripts/aos-profile.js"></script>
</body>
</html>
