<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — AgentOS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="media/logo.png" alt="AgentOS logo" class="logo" />
        <span>AgentOS</span>
      </a>
      <nav class="nav-links">
        <a href="features.html">Features</a>
        <a href="exams.html">Dashboard</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
      <div class="nav-cta"></div>
    </div>
  </header>

  <main class="container content profile-page">
    <section class="profile-shell">
      <div class="profile-card">
        <div class="profile-card__banner"></div>
        <div class="profile-card__body">
          <img id="profileAvatar" class="profile-card__avatar" alt="Profile avatar" />
          <div class="profile-card__identity">
            <h1 id="profileName">Loading profile...</h1>
            <p id="profileHandle">Fetching account details...</p>
            <p id="profileBio" class="profile-card__bio"></p>
          </div>
        </div>
        <div id="profileRoles" class="profile-roles"></div>
      </div>

      <div class="profile-grid">
        <section class="profile-panel">
          <h2>Review stats</h2>
          <div class="profile-stats" id="profileStats"></div>
        </section>

        <section class="profile-panel">
          <h2>Recent submissions</h2>
          <div id="recentSubmissions" class="profile-activity"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="brand-sm">
        <img src="media/logo.png" alt="AgentOS" />
        <span>AgentOS</span>
      </div>
      <nav class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
      </nav>
      <p class="copyright">© <span id="year-profile"></span> AgentOS</p>
    </div>
  </footer>
  <script>document.getElementById('year-profile').textContent=new Date().getFullYear();</script>
  <script src="scripts/server-config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/profile.js"></script>
</body>
</html>
