<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="media/osi_icon.ico" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgentOS — AOS Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html">
          <img src="media/logo.png" alt="AgentOS logo" class="logo" />
          <span>AgentOS</span>
        </a>
        <nav class="nav-links">
          <a href="features.html">Features</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </nav>
        <div class="nav-cta"></div>
      </div>
    </header>

    <main class="container aos-page">
      <div class="dashboard-header">
        <div>
          <h1>AOS Dashboard</h1>
          <p id="statusMsg">Loading...</p>
          <p id="aosSummary" class="aos-profile-note"></p>
        </div>
      </div>

      <div class="aos-controls">
        <input id="aosSearch" class="aos-search" type="search" placeholder="Search by username, charge, tag, thread, victim, or summary" autocomplete="off" />
        <p id="aosSearchSummary" class="aos-search-summary"></p>
      </div>

      <div id="aosDashboardList"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="brand-sm">
          <img src="media/logo.png" alt="AgentOS" />
          <span>AgentOS</span>
        </div>
        <nav class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Service</a>
        </nav>
        <p class="copyright">© <span id="year-aos-dashboard"></span> AgentOS</p>
      </div>
    </footer>
    <script>document.getElementById('year-aos-dashboard').textContent = new Date().getFullYear();</script>

    <script src="scripts/mobile-nav.js"></script>
    <script src="scripts/server-config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/aos-utils.js"></script>
    <script src="scripts/aos-dashboard.js"></script>
  </body>
</html>
